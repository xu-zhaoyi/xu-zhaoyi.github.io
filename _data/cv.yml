      year: 2021 - Present
      tags:
        - microfluidics
        - microfabrication
        - hPSC
        - organoids
        - embryonic development
        - biomimetic systems
      description:
        - "Supervisor: Professor Jianping Fu"
        - title: "Thesis: Synthetic 3D hPSC Models on Peri-Implantation Development"
          contents:
            - "Developed biomimetic implantation-like niches for 3D hPSC organoid culture using microfluidics and microfabrication, replicating maternal tissue properties to study early human embryo development events."
            - "Independently initiated and executed three sub-projects, leading to publications."
            
    - title: PhD student researcher
      institution: University of Michigan
      year: 2022 - 2024
      tags:
        - mechanobiology
        - acoustic tweezing
        - biomechanics
        - hPSC
        - neural differentiation
        - motor neurons
      description:
        - "Supervisor: Professor Jianping Fu, Professor Cheri Deng"
        - title: "Neural Differentiation of hPSCs via Acoustic Tweezing Cytometry"
          contents:
          - Collaborated on developing the living soft microrobot, RoboWorm, using optogenetic control of C. elegans with microfluidic tools; resulted in a notable Science Robotics publication (publication [2]).
          - My work improved RoboWorm technology, elevating success rate from 7.1\% to 80.77\%, by creating a new transgenic C. elegans strain and enhancing the control system's robustness.
          - Collaborated closely with the renowned molecular biology team at Mount Sinai Hospital (Zhen lab) on a daily basis.

    - title: MASc Student Researcher
