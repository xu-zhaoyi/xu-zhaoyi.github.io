      year: 2019 – 2021
      description:
        - "Supervisor: Professor Xinyu Liu"
        - title: "Thesis: An Improved Approach for Optogenetic Locomotion Control of Caenorhabditis elegans"
          contents:
            - "Collaborated on developing the living soft microrobot RoboWorm using optogenetic control of C. elegans with microfluidic tools, resulting in a Science Robotics publication."
            - "Improved RoboWorm technology by increasing success rate from 7.1% to 80.77% through creation of a new transgenic C. elegans strain and enhanced control robustness."
